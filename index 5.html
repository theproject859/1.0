<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout Scanner</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--fg:#14231f;--mut:#55685f;--line:#d5dfdb;--acc:#0b6e5a;--on:#fff;--good:#197a3e;--warn:#8a5a00;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1614;--card:#17221f;--fg:#e6efeb;--mut:#9bb0a8;--line:#2a3a35;--acc:#4fcfae;--on:#06201a;--good:#6bd18f;--warn:#e8b552;--bad:#ff8d83;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:12px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
h1{margin:0}h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.num{font-variant-numeric:tabular-nums}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}.sel{border-color:var(--acc);color:var(--acc);font-weight:700}
a{color:var(--acc)}svg{width:100%;height:100px}
[hidden]{display:none!important}#head .row:first-child{gap:4px;flex-wrap:nowrap}#head .row:first-child button{flex:1 1 auto;padding:7px 4px;font-size:14px}.big{font-size:34px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}svg.eq{height:140px}button.link{border:0;padding:0;background:none}input[data-c],input[data-bot]{width:120px}summary{cursor:pointer;color:var(--acc)}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:6px}nav button{flex:1 1 17%;padding:8px 2px;font-size:14px}
</style><body>
<nav id="nav"></nav><div class="wrap"><h1>Scout</h1><div id="status" class="mut" role="status"></div><div id="alerts"></div><div id="head" class="card"></div><div id="body" style="display:grid;grid-template-columns:minmax(0,1fr);gap:10px"></div></div>
<script>
const KEY="scoutlive-v1",CG="https://api.coingecko.com/api/v3",TD="https://api.twelvedata.com",MV="https://api.massive.com";
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const money=n=>n==null||!isFinite(n)?"?":"$"+(Math.abs(n)>=1?n.toLocaleString("en-US",{maximumFractionDigits:2}):Number(n.toPrecision(4)).toLocaleString("en-US",{maximumSignificantDigits:4}));
const big=n=>n>=1e9?"$"+(n/1e9).toFixed(1)+"B":"$"+(n/1e6).toFixed(1)+"M";
let S={key:"",mkey:"",seen:{},coins:[],stocks:[],pos:{},closed:[],log:[],minCap:1e5,minVol:1e4,memeMax:1e8,watch:{},risk:20};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){say("This browser could not save your changes.")}};
let tab="Home",open=null,item=null,mine=false,coinList=[],plans={},query="",picks={coin:[],stock:[]},scanned={coin:"",stock:""},busy={coin:false,stock:false},problem={coin:"",stock:"",block:""};
if(S.v!==3){S.v=3;S.minCap=1e5;S.minVol=1e4}
const coinMap=new Map(),coinRows=new Map();let limit=100,chip="All",smallest=false,stockNote="";
const SECTORS=Object.fromEntries(Object.entries({Technology:"TSM ASML SAP SONY INFY AAPL MSFT NVDA AMD AVGO ORCL CRM ADBE INTC QCOM MU TXN IBM CSCO NOW PLTR SMCI ARM PANW CRWD SNOW DELL HPQ AMAT LRCX KLAC MRVL ANET FTNT DDOG NET MDB SHOP UBER APP IONQ RGTI SOUN BBAI",Communication:"BIDU NTES SE GOOGL GOOG META NFLX DIS CMCSA T VZ TMUS WBD SNAP PINS RDDT SPOT ROKU EA TTWO RBLX",Health:"NVO AZN NVS SNY LLY UNH JNJ PFE MRK ABBV TMO ABT DHR BMY AMGN GILD CVS CI HUM ISRG MDT BSX SYK VRTX REGN MRNA BIIB HIMS",Finance:"HSBC UBS NU MUFG ITUB JPM BAC WFC C GS MS SCHW BLK AXP V MA PYPL COF USB PNC TFC COIN HOOD SOFI UPST AFRM MSTR",Energy:"SHEL BP TTE PBR XOM CVX COP SLB EOG OXY MPC PSX VLO HAL DVN FANG KMI WMB APA RIG",Consumer:"BABA PDD JD UL DEO AMZN WMT COST HD LOW TGT MCD SBUX NKE KO PEP PG CL MDLZ CMG BKNG ABNB DKNG CVNA GME CHWY ETSY DG DLTR KR MO PM",Industrials:"BA CAT DE GE HON LMT RTX NOC GD UPS FDX UNP CSX MMM ETN EMR RKLB ACHR JOBY",Autos_and_travel:"TM HMC TSLA F GM RIVN LCID NIO XPEV LI UAL DAL AAL LUV CCL RCL NCLH",Materials:"BHP RIO VALE LIN APD SHW FCX NEM NUE DOW DD ALB CLF AA MP",Utilities:"NEE DUK SO D AEP EXC SRE XEL VST CEG NRG OKLO SMR",Real_estate:"PLD AMT EQIX CCI PSA O SPG WELL DLR OPEN",Crypto_stocks:"MARA RIOT CLSK HUT BITF WULF CIFR IREN"}).flatMap(([n,l])=>l.split(" ").map(t=>[t,n.replace(/_/g," ")])));
const say=t=>$("status").textContent=t;
/* one request at a time per provider, spaced to stay inside free limits */
const lanes={cg:{gap:12000,t:0,q:Promise.resolve()},td:{gap:8000,t:0,q:Promise.resolve()},mv:{gap:12500,t:0,q:Promise.resolve()},gt:{gap:7000,t:0,q:Promise.resolve()},ds:{gap:1500,t:0,q:Promise.resolve()},rc:{gap:2500,t:0,q:Promise.resolve()}};
function get(lane,url){const L=lanes[lane];const run=async()=>{const w=L.t+L.gap-Date.now();if(w>0)await new Promise(r=>setTimeout(r,w));L.t=Date.now();let r;try{r=await fetch(url)}catch(e){throw Error("Could not reach the data service. Check your connection, and open this file in a web browser. A busy free service can also cause this.")}if(r.status===429){L.t=Date.now()+60000;throw Error("Free data limit reached. Wait a minute.")}const d=await r.json().catch(()=>null);if(!r.ok||!d||d.status==="error")throw Object.assign(Error(d&&(d.message||d.error)||"Data service error "+r.status),{status:r.status});return d};const p=L.q.then(run);L.q=p.catch(()=>{});return p}
/* small browser database for the stock history */
let dbp;const idb=()=>dbp||(dbp=new Promise(ok=>{try{const q=indexedDB.open("scoutscan",1);q.onupgradeneeded=()=>q.result.createObjectStore("c");q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)}catch(e){ok(null)}}));
const mem={};async function cache(key,val){const db=await idb();if(val!==undefined)mem[key]=val;if(!db)return mem[key];return new Promise(ok=>{try{const st=db.transaction("c",val===undefined?"readonly":"readwrite").objectStore("c"),q=val===undefined?st.get(key):st.put(val,key);q.onsuccess=()=>ok(val===undefined?q.result:val);q.onerror=()=>ok(mem[key])}catch(e){ok(mem[key])}})}
/* 0-100: how many "ready to run" conditions line up */
function score(pl,f){if(!pl||pl.stale)return 0;let n=0;if(pl.label==="BUY setup")n+=40;else if(pl.trend)n+=15;n+=Math.max(0,Math.min(20,f.week*100));n+=Math.max(0,Math.min(25,(f.surge-1)*25));if(f.day>0&&f.day<(f.coin?.25:.08))n+=15;return Math.round(n)}
const READY=70;
const ready=x=>x.pl.label==="BUY setup"&&x.score>=READY&&(!x.coin||Date.now()-x.pl.t<36e5);
function announce(kind,list){const now=new Set(list.filter(ready).map(x=>x.id)),old=new Set(S.seen[kind]||[]);list.filter(x=>now.has(x.id)&&!old.has(x.id)).slice(0,5).reverse().forEach(x=>alertUser(`Ready: ${x.sym} (score ${x.score}) buy near ${money(x.pl.entry)}`,kind,x.id));S.seen[kind]=[...now];save()}
const coinUrl=q=>`${CG}/coins/markets?vs_currency=usd&sparkline=true&price_change_percentage=24h,7d,30d&${q}`;
function processCoins(d){const fire=[];for(const x of d){coinMap.set(x.id,x);const p=(x.sparkline_in_7d?.price||[]).filter(v=>v>0);if(p.length<30||!(x.current_price>0))continue;p.push(x.current_price);const t=Date.parse(x.last_updated)||Date.now(),pl=plan(p.map(c=>({t,c,h:c,l:c})),36e5,.02);plans[k("coin",x.id,"swing")]=pl;const week=(x.price_change_percentage_7d_in_currency||0)/100,month=(x.price_change_percentage_30d_in_currency||0)/100;
const live=Date.now()-t<9e5;if(live){coinCheck(x,pl,week,month);watchCoin(x.id,pl)}
if(!(x.market_cap>=S.minCap&&x.market_cap<=S.memeMax&&x.total_volume>=S.minVol)){coinRows.delete(x.id);continue}const day=(x.price_change_percentage_24h_in_currency||0)/100;
const row={id:x.id,coin:true,long:live&&longPick(x,pl,week,month),sym:x.symbol.toUpperCase(),name:x.name,cap:x.market_cap,pl,day,score:score(pl,{coin:true,day,week,surge:1+(x.total_volume/x.market_cap)*5})};coinRows.set(x.id,row);if(row.long)fire.push(row)}
picks.coin=[...coinRows.values()].sort((a,b)=>b.score-a.score);announce("coin",picks.coin);fire.sort((a,b)=>b.score-a.score).forEach(x=>buy("memeLong","coin",x.id,x.sym,x.pl.last,"week and month uptrend"));snap();save()}
async function scanCoins(){if(busy.coin)return;busy.coin=true;try{let cut="",total=0;for(let page=1;page<=40;page++){let d,err;for(let n=0;n<3&&!d;n++){try{d=await get("cg",coinUrl(`category=meme-token&order=market_cap_desc&per_page=250&page=${page}`))}catch(e){err=e;lanes.cg.t=Date.now()+45000}}if(!d){if(!total)throw err;cut=err.message;break}total+=d.length;processCoins(d);scanned.coin=new Date().toLocaleTimeString();say(`Meme coins: ${total} checked, ${picks.coin.length} pass your filters. Still scanning…`);refresh();if(d.length<250||!(d[d.length-1].market_cap>=S.minCap))break}
problem.coin=cut?"Only part of the list loaded. "+cut:"";say(`Meme scan finished: ${total} checked, ${picks.coin.length} pass your filters.`)}finally{busy.coin=false}}
/* every minute: fresh prices for open trades, watchlist and ready coins */
let quickBusy=false;async function quick(){if(quickBusy)return;const ids=[...new Set([...B.open.filter(t=>t.src==="coin").map(t=>t.id),...S.coins,...picks.coin.filter(x=>x.long||ready(x)).slice(0,40).map(x=>x.id)])].slice(0,250);if(!ids.length)return;quickBusy=true;try{processCoins(await get("cg",coinUrl(`per_page=250&ids=${ids.map(encodeURIComponent)}`)))}finally{quickBusy=false}}
/* four practice bots sharing one practice account */
const BOTS={memeDay:"Meme day trader",memeLong:"Meme week-to-month",stockDay:"Stock day trader",stockLong:"Stock long term"};
const RULES={memeDay:"Brand new Solana coins that pass the rug check, with squeeze 70+ and safety 60+. Time limit is in minutes.",memeLong:"Bigger meme coins ($20M+ value, $1M+ daily volume) in a steady uptrend over a week and a month, plus your watchlist. Time limit is in days.",stockDay:"Up to 6 stocks from your watchlist and top picks, on 5-minute prices. Sells before the market closes. Needs the Twelve Data key. Time limit is in minutes.",stockLong:"Established stocks priced $5+ in an uptrend, plus your watchlist. Buys and sells on daily prices, so orders fill on a later day. Time limit is in days."};
const DEF={memeDay:{on:false,size:25,max:5,stop:15,target:25,hold:60,dayLoss:100},memeLong:{on:false,size:50,max:5,stop:20,target:50,hold:30,dayLoss:150},stockDay:{on:false,size:50,max:3,stop:3,target:6,hold:240,dayLoss:50},stockLong:{on:false,size:100,max:5,stop:10,target:30,hold:90,dayLoss:150}};
const note=t=>{B.log.unshift({t:Date.now(),text:t});B.log=B.log.slice(0,100)};
const val=t=>t.pending?t.size:t.size*t.now/t.entry*(1-t.fee);
const worth=()=>B.cash+B.open.reduce((a,t)=>a+val(t),0);
function snap(force){const l=B.eq.at(-1);if(!force&&l&&Date.now()-l[0]<12e4)return;B.eq.push([Date.now(),+worth().toFixed(2)]);if(B.eq.length>800)B.eq=B.eq.filter((x,i)=>i>400||i%2===0)}
function migrate(){if(B.v===4)return;const old={...B};B.bots=JSON.parse(JSON.stringify(DEF));Object.assign(B.bots.memeDay,{on:!!old.on,size:old.size||25,max:old.max||5,stop:old.stop||15,target:old.target||25,hold:old.mins||60,dayLoss:old.dayLoss||100});B.start=1000;
B.open=(old.open||[]).map((t,i)=>{const src=t.kind||"new",fee=t.fee??.03,bot=src==="new"?"memeDay":src==="coin"?"memeLong":"stockLong",buy=t.entry*(1-fee),c=B.bots[bot];return{...t,uid:"o"+i+Date.now(),src,bot,id:src==="new"?t.mint:t.id,fee,buy,peak:Math.max(buy,t.now||0),stop:t.stop||buy*(1-c.stop/100),target:t.target||buy*(1+c.target/100),now:t.now||buy}});
let sum=B.start;const done=[...(old.done||[])].reverse();B.eq=done.length?[[done[0].t-6e4,B.start]]:[];for(const d of done)B.eq.push([d.t,+(sum+=d.pl).toFixed(2)]);B.v=4;snap(true)}
const todayPL=bot=>B.done.filter(x=>x.bot===bot&&!x.manual&&new Date(x.t).toDateString()===new Date().toDateString()).reduce((a,x)=>a+x.pl,0);
let lastWhy="";
function buy(bot,src,id,name,price,why,o={}){const c=B.bots[bot],no=t=>(lastWhy=t,false),size=o.size||c.size;if(!(price>0)||!(size>0))return no("No price or amount.");if(B.open.some(t=>t.id===id))return no("You already hold this one.");if(B.cash<size)return no("Not enough practice cash.");
if(!o.manual){if(!c.on)return false;const mineOpen=B.open.filter(t=>t.bot===bot&&!t.manual);if(mineOpen.length>=c.max)return false;if(B.done.some(t=>t.id===id&&Date.now()-t.t<216e5))return false;if(-todayPL(bot)>=c.dayLoss)return false}
const fee=src==="stock"?.002:.03;B.cash-=size;const t={uid:"t"+Date.now()+Math.random().toString(36).slice(2,6),bot,src,id,name,size,fee,buy:price,entry:price/(1-fee),now:price,peak:price,stop:price*(1-c.stop/100),target:price*(1+c.target/100),t:Date.now(),manual:!!o.manual,pool:o.pool,pending:!!o.pending,bar:o.bar,days:0};B.open.push(t);
const text=t.pending?`Order: ${name} at ${money(price)} or better, next session (${BOTS[bot]})`:`Bought ${name} at ${money(price)} for $${size} (${why})`;note(text);alertUser(text,src,id);snap(true);save();return true}
function sell(t,price,why){if(!B.open.includes(t))return;B.open=B.open.filter(x=>x!==t);if(t.pending){B.cash+=t.size;note(`Order cancelled: ${t.name} (${why})`);save();return}
const back=t.size*(price/t.entry)*(1-t.fee),pl=back-t.size;B.cash+=back;B.done.unshift({id:t.id,name:t.name,bot:t.bot,src:t.src,manual:t.manual,size:t.size,buy:t.buy,sell:price,bought:t.t,t:Date.now(),pl,why});B.done=B.done.slice(0,500);
const text=`Sold ${t.name}: ${why}, ${pl<0?"lost":"made"} $${Math.abs(pl).toFixed(2)}`;note(text);alertUser(text,t.src,t.id);const c=B.bots[t.bot];if(!t.manual){const recent=B.done.filter(x=>x.bot===t.bot&&!x.manual&&x.t>(c.since||0)).slice(0,3);if(recent.length===3&&recent.every(x=>x.pl<=0)){c.on=false;note(BOTS[t.bot]+" paused after 3 losses in a row.");alertUser(BOTS[t.bot]+" paused after 3 losses in a row.",t.src,t.id)}}snap(true);save()}
const isDay=bot=>bot.endsWith("Day");
/* one price check: raise the stop once a trade is well ahead, then look for an exit */
function tick(t,price,lo=price,hi=price){if(t.pending||!(price>0))return;const c=B.bots[t.bot];t.now=price;
if(lo<=t.stop)return sell(t,Math.min(t.stop,hi),t.stop>t.buy?"raised stop hit":"stop hit");if(hi>=t.target)return sell(t,Math.max(t.target,lo),"target hit");
t.peak=Math.max(t.peak,hi);if(t.peak>=t.buy*(1+c.target/200)){const even=t.buy/(1-t.fee)/(1-t.fee);const lock=isDay(t.bot)?even:Math.max(even,t.peak*(1-c.stop/100));if(lock<price)t.stop=Math.max(t.stop,lock)}
if(Date.now()-t.t>c.hold*(isDay(t.bot)?6e4:864e5))sell(t,price,"time limit")}
/* meme coins from the main list */
function coinCheck(x,pl,week,month){const t=B.open.find(t=>t.src==="coin"&&t.id===x.id);if(t){tick(t,pl.last);if(B.open.includes(t)&&!isDay(t.bot)&&Date.now()-t.t>2592e5&&week<-.1)sell(t,pl.last,"weekly downtrend")}}
const longPick=(x,pl,week,month)=>x.market_cap>=2e7&&x.total_volume>=1e6&&pl.label==="BUY setup"&&week>0&&week<.5&&month>0&&month<1.5;
const waitFor=pl=>({entry:pl.entry,stop:pl.stop,target:pl.target,up:pl.entry>pl.last,t:Date.now(),bar:pl.t});
function watchCoin(id,pl){if(!S.coins.includes(id))return;const key="coin|"+id;let w=S.watch[key];if(!w||Date.now()-w.t>2592e5||w.fired&&Date.now()-w.fired>216e5){S.watch[key]=w=waitFor(pl);if(pl.label!=="BUY setup")return}if(w.fired)return;const hit=pl.label==="BUY setup"||(w.up?pl.last>=w.entry&&pl.last<=w.entry*1.1:pl.last<=w.entry&&pl.last>w.stop);if(!hit)return;w.fired=Date.now();alertUser(`Watchlist: time to look at buying ${nameOf("coin",id)} at ${money(pl.last)}`,"coin",id);buy("memeLong","coin",id,nameOf("coin",id),pl.last,"watchlist")}
/* long term stocks use daily bars */
function stockTrade(id,pl){const t=B.open.find(t=>t.src==="stock"&&t.id===id&&!isDay(t.bot));if(t&&pl.t>t.bar){t.bar=pl.t;if(t.pending){if(pl.lo<=t.buy){const fill=Math.min(t.buy,pl.hi),r=fill/t.buy;Object.assign(t,{pending:false,buy:fill,entry:fill/(1-t.fee),stop:t.stop*r,target:t.target*r,peak:fill,now:pl.last,t:Date.now()});note(`Order filled: ${id} at ${money(fill)}`);alertUser(`Order filled: ${id} at ${money(fill)}`,"stock",id);if(pl.lo<=t.stop)sell(t,t.stop,"stop hit")}else if(++t.days>=3)sell(t,0,"never reached the price")}else tick(t,pl.last,pl.lo,pl.hi)}
if(!S.stocks.includes(id))return;const key="stock|"+id,w=S.watch[key];if(!w){S.watch[key]=waitFor(pl);return}if(pl.t<=w.bar)return;if(w.up?pl.hi>=w.entry:pl.lo<=w.entry){alertUser(`Watchlist: ${id} reached your buy level ${money(w.entry)}`,"stock",id);buy("stockLong","stock",id,id,pl.last,"watchlist",{pending:true,bar:pl.t});S.watch[key]=waitFor(pl)}else if(Date.now()-w.t>6048e5)S.watch[key]=waitFor(pl)}
const longStocks=()=>picks.stock.filter(x=>!x.penny&&x.pl.last>=5&&x.score>=60&&x.pl.trend&&x.week<.15);
const stockOrders=()=>longStocks().slice(0,10).forEach(x=>buy("stockLong","stock",x.id,x.id,x.pl.last,"uptrend",{pending:true,bar:x.pl.t}));
/* stock day trading on 5-minute prices */
function nyNow(now=new Date()){const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now).map(x=>[x.type,x.value]));return{open:!["Sat","Sun"].includes(p.weekday),min:+p.hour*60+ +p.minute}}
let dayTurn=0,dayBusy=false,dayState="Waiting.";
async function stockDayStep(){if(dayBusy)return;const n=nyNow(),mine=B.open.filter(t=>t.bot==="stockDay");
for(const t of mine)if(n.open&&n.min>=950||new Date(t.t).toDateString()!==new Date().toDateString())sell(t,t.now,"end of day")
if(!B.bots.stockDay.on&&!mine.length){dayState="Bot is off.";return}if(!S.key){dayState="Add your Twelve Data key in Settings.";return}if(!n.open||n.min<575||n.min>=955){dayState="US market is closed. Day trading runs weekdays, about 8:35 AM to 2:45 PM Central.";return}
const day=new Date().toDateString();if(S.tdDay!==day){S.tdDay=day;S.tdCount=0}if(S.tdCount>=750){dayState="Daily free price limit reached.";return}
const list=[...new Set([...mine.map(t=>t.id),...[...S.stocks,...longStocks().map(x=>x.id)].slice(0,6)])];if(!list.length){dayState="Waiting for the stock scan, or add stocks to your watchlist.";return}
const id=list[dayTurn++%list.length];dayBusy=true;try{S.tdCount++;const pl=await check("stock",id,"day");dayState=`Checked ${id} at ${new Date().toLocaleTimeString()}: ${pl.label}. Watching ${list.join(", ")}.`;const t=B.open.find(t=>t.id===id&&t.bot==="stockDay");if(pl.stale)return;if(t)tick(t,pl.last);else if(pl.label==="BUY setup"&&n.min<900)buy("stockDay","stock",id,id,pl.last,"5-minute uptrend")}catch(e){dayState=e.message}finally{dayBusy=false}}
/* fast prices for open new coin trades */
let fastBusy=false,fastAt="";
async function fast(){const list=B.open.filter(t=>t.src==="new");if(fastBusy||!list.length)return;fastBusy=true;try{const d=await get("ds",`https://api.dexscreener.com/latest/dex/pairs/solana/${list.slice(0,30).map(t=>encodeURIComponent(t.pool)).join(",")}`);for(const p of d.pairs||[]){const t=list.find(t=>t.pool===p.pairAddress);if(t)tick(t,+p.priceUsd)}fastAt=new Date().toLocaleTimeString();snap();save()}finally{fastBusy=false}}
const progress=t=>{stockNote=t;say(t);if(tab==="Stocks")refresh()};

function plan(c,maxAge,floor,now=Date.now()){if(c.length<30)return null;const p=c.map(x=>x.c),n=p.length,last=p[n-1],fast=ema(p,9),slow=ema(p,21);let up=0,dn=0,tr=0;for(let i=n-14;i<n;i++){const d=p[i]-p[i-1];d>0?up+=d:dn-=d;tr+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-p[i-1]),Math.abs(c[i].l-p[i-1]))}
const rsi=up+dn?100*up/(up+dn):50,atr=Math.max(tr/14,last*floor),trend=fast>slow&&last>slow;let label,cls,entry,why;
if(trend&&rsi>=45&&rsi<=70&&last<=fast+1.5*atr){label="BUY setup";cls="good";entry=last;why="Short average is above the long average and the move is not stretched."}
else if(trend){label="WAIT for a dip";cls="warn";entry=Math.min(fast,last-atr);why="Trend is up but the price is stretched or momentum is out of range. Consider buying only near the entry, if it holds."}

const stop=Math.max(entry-2*atr,entry*.5);return{label,cls,why,last,entry,stop,target:entry+1.5*(entry-stop),rsi,trend,stale,t:c[n-1].t,series:p,hi:c[n-1].h,lo:c[n-1].l}}

function coinCard(x,i){const rc=x.rug||rugs[x.mint],pin=B.pins.includes(x.pool),m=esc(x.mint);return`<div class="card"><div class="row between"><b>${esc(x.name)}</b><span class="tag">${stage(x)}</span></div>${x.safe!==undefined?`<div>Safety ${x.safe} · Squeeze ${x.heat}</div>`:""}${rc?`<div class="${rc.ok?"good":"bad"}">${rc.ok?"Passed rug check":"Do not buy: not approved"}</div><div class="mut">${esc(rc.why)}</div>`:'<div class="warn">Not rug checked. Do not treat as safe.</div>'}<div class="num">Market value $${Math.round(x.cap).toLocaleString("en-US")} · ${Math.round(x.age)} min old</div><div class="num mut">Liquidity ${money(x.liq)} · 1h volume ${money(x.vol)} · 5m ${x.m5.toFixed(0)}% · 1h ${x.h1.toFixed(0)}%<br>5m: ${x.b5} buys, ${x.s5} sells · 1h: ${x.buys} buys, ${x.sells} sells</div>${infoBox(x.mint)}<div class="row">${B.open.some(t=>t.id===x.mint)?'<span class="good">In your portfolio</span>':`<button class="p" data-act="demonew" data-id="${m}">Practice buy $${B.bots.memeDay.size}</button>`}<button data-act="info" data-id="${m}">Holders and socials</button><button data-act="pin" data-id="${esc(x.pool)}" class="${pin?"sel":""}">${pin?"Tracking":"Track"}</button></div><div class="row">${out("https://dexscreener.com/solana/"+encodeURIComponent(x.mint),"Chart")}${out("https://rugcheck.xyz/tokens/"+encodeURIComponent(x.mint),"Full rug report")}${out("https://solscan.io/token/"+encodeURIComponent(x.mint),"Wallets and trades")}${rc?.ok?out("https://jup.ag/swap/SOL-"+encodeURIComponent(x.mint),"Buy on Jupiter"):""}</div></div>`}
function board(){const cols=["Bot picks","New pairs","Final stretch","Migrated","Tracked"];let l=col==="Bot picks"?fresh:col==="Tracked"?tracked.filter(x=>B.pins.includes(x.pool)):every0.filter(x=>x.mint&&x.age<=1440&&stage(x)===col).sort((a,b)=>a.age-b.age);return`<div class="row">${cols.map(c=>`<button data-act="col" data-v="${c}" class="${c===col?"sel":""}">${c}</button>`).join("")}</div>${col==="Final stretch"?'<div class="mut">Estimate: pump.fun coins at $40,000 market value or more.</div>':""}`+(l.slice(0,40).map(coinCard).join("")||`<div class="card">${!freshAt?"Waiting for the first new coin scan.":col==="Tracked"?"Tap Track on a coin. It appears here after the next scan.":"No coins in this column right now."}</div>`)}
const out=(u,t)=>`<a target="_blank" rel="noopener" href="${u}">${t}</a>`;
let sub={Memes:"Day bot",Stocks:"Day bot"},range="All",awake=null,amount=50,armed=0,tradeMsg="";
const usd=n=>(n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const signed=n=>`<span class="${n<0?"bad":"good"}">${n<0?"":"+"}${usd(n)}</span>`;
const btn=(act,label,extra="",cls="")=>`<button data-act="${act}" class="${cls}" ${extra}>${label}</button>`;
function equity(){const now=Date.now(),from=range==="1 day"?now-864e5:range==="1 week"?now-6048e5:0;let pts=B.eq.filter(x=>x[0]>=from);pts=[...pts,[now,worth()]];if(pts.length<2)return'<div class="mut">The line appears as prices update and trades close.</div>';
const v=pts.map(x=>x[1]);let lo=Math.min(...v),hi=Math.max(...v);const pad=Math.max((hi-lo)*.1,1);lo-=pad;hi+=pad;const t0=pts[0][0],X=t=>(t-t0)/Math.max(1,now-t0)*300,Y=n=>100-(n-lo)/(hi-lo)*100,up=v.at(-1)>=v[0],col=up?"var(--good)":"var(--bad)",line=pts.map(x=>X(x[0]).toFixed(1)+","+Y(x[1]).toFixed(1)).join(" ");
return`<svg class="eq" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Account value over time, ${up?"up":"down"}"><polygon fill="${col}" opacity=".12" points="0,100 ${line} 300,100"/><line x1="0" x2="300" y1="${Y(v[0])}" y2="${Y(v[0])}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" points="${line}"/></svg><div class="row between mut num"><span>${new Date(t0).toLocaleDateString()} ${usd(v[0])}</span><span>${up?"Up":"Down"} ${usd(Math.abs(v.at(-1)-v[0]))}</span></div>`}
function stats(list){const w=list.filter(x=>x.pl>0),l=list.filter(x=>x.pl<=0),sum=a=>a.reduce((s,x)=>s+x.pl,0);return list.length?`${list.length} closed · ${Math.round(w.length/list.length*100)}% won · avg win ${usd(w.length?sum(w)/w.length:0)} · avg loss ${usd(l.length?sum(l)/l.length:0)} · total ${signed(sum(list))}`:"No closed trades yet."}
const hero=()=>{const w=worth(),d=w-B.start;return`<div class="card"><div class="mut">Practice account (pretend money)</div><div class="big num">${usd(w)}</div><div class="num">${signed(d)} (${(d/B.start*100).toFixed(1)}%) since ${usd(B.start)} · Cash ${usd(B.cash)}</div>${equity()}<div class="row">${["1 day","1 week","All"].map(r=>btn("range",r,`data-v="${r}"`,r===range?"sel":"")).join("")}</div></div>`};
function posCard(t){const g=val(t)-t.size;return`<div class="card"><div class="row between"><button class="link" data-act="show" data-kind="${t.src}" data-id="${esc(t.id)}"><b>${esc(t.name)}</b></button><span class="num">${t.pending?"Waiting to fill":signed(g)+" ("+(g/t.size*100).toFixed(1)+"%)"}</span></div><div class="mut num">${BOTS[t.bot]}${t.manual?" · your trade":""} · $${t.size}<br>${t.pending?"Buy at":"Bought"} ${money(t.buy)}${t.pending?"":" · now "+money(t.now)} · stop ${money(t.stop)} · target ${money(t.target)}</div>${btn("sell",t.pending?"Cancel order":"Sell now",`data-uid="${t.uid}"`)}</div>`}
const alertList=n=>S.log.slice(0,n).map(a=>`<button class="card" style="text-align:left" data-act="show" data-kind="${esc(a.kind)}" data-id="${esc(a.id)}"><span>${esc(a.text)}</span><span class="mut">${new Date(a.t).toLocaleString()}</span></button>`).join("")||'<div class="card">No alerts yet.</div>';
function botTile(k){const c=B.bots[k],n=B.open.filter(t=>t.bot===k).length,pl=B.done.filter(t=>t.bot===k).reduce((a,t)=>a+t.pl,0);return`<div class="card"><b>${BOTS[k]}</b><span class="${c.on?"good":"mut"}">${c.on?"Running":"Off"}</span><span class="mut num">${n} open · sold ${signed(pl)}</span>${btn("bot",c.on?"Stop":"Start",`data-v="${k}"`,c.on?"":"p")}</div>`}
function botCard(k){const c=B.bots[k],unit=isDay(k)?"min":"days";return`<div class="card"><div class="row between"><h2>${BOTS[k]}: ${c.on?"running":"off"}</h2>${btn("bot",c.on?"Stop bot":"Start bot",`data-v="${k}"`,"p")}</div><div class="mut">${RULES[k]}</div><div class="mut">${stats(B.done.filter(t=>t.bot===k))}</div><details data-d="${k}" ${openD[k]?"open":""}><summary>Bot settings</summary><div class="row">${[["size","$ per trade"],["max","Max open"],["dayLoss","Daily loss limit $"],["stop","Stop %"],["target","Target %"],["hold",`Time limit (${unit})`]].map(([f,l])=>`<label>${l}<br><input id="c-${k}-${f}" data-c="${k}" data-f="${f}" type="number" min="1" value="${c[f]}"></label>`).join("")}${k==="memeDay"?[["minLiq","Min liquidity $"],["maxCap","Max market value $"]].map(([f,l])=>`<label>${l}<br><input id="b-${f}" data-bot="${f}" type="number" min="1" value="${B[f]}"></label>`).join(""):""}</div></details></div>`+B.open.filter(t=>t.bot===k).map(posCard).join("")}
const openD={};
function newCoins(){let b=problem.fresh?`<div class="card bad">${esc(problem.fresh)}</div>`:"";b+=`<div class="card"><div class="row between"><b>New coin tracker</b>${btn("fresh","Scan now")}</div><div class="mut">${freshAt?"Checked at "+freshAt:"Not checked yet"}. Open trades are re-priced about every 10 seconds${fastAt?", last at "+fastAt:""}. Most new meme coins lose nearly all their value.</div>${stats0()}</div>`;return b+board()}
const stats0=()=>stats_?`<details data-d="why" ${openD.why?"open":""}><summary>Why trades happen or not</summary><div>Checked ${stats_.seen}, passed filters ${stats_.passed}, failed rug check ${stats_.rug}, squeeze under 70: ${stats_.low}</div>${Object.entries(stats_.why).map(([w,n])=>`<div class="mut">Skipped, ${w}: ${n}</div>`).join("")}</details>`:"";
function tradeBox(kind,id){if(B.open.some(t=>t.id===id))return B.open.filter(t=>t.id===id).map(posCard).join("");return`<div class="card"><h2>Practice trade</h2><label>Amount $<input id="amt" type="number" min="1" value="${amount}"></label><div class="row">${btn("demo","Buy as day trade",`data-kind="${kind}" data-id="${esc(id)}" data-v="Day"`,"p")}${btn("demo","Buy to hold longer",`data-kind="${kind}" data-id="${esc(id)}" data-v="Long"`)}</div><div class="mut">${kind==="stock"?"A longer hold fills at the last closing price. A day trade uses the latest 5-minute price while the market is open.":"Fills at the latest price shown, with a 3% cost each way."} Cash ${usd(B.cash)}.</div>${tradeMsg?`<div class="warn" role="alert">${esc(tradeMsg)}</div>`:""}</div>`}
function itemView(){const[kind,id]=item;if(kind==="new"){const x=known(id),t=B.open.filter(t=>t.id===id).map(posCard).join("");return t+(x?coinCard(x):`<div class="card">This coin is no longer in the latest scan. ${out("https://dexscreener.com/solana/"+encodeURIComponent(id),"Open its chart")}</div>`)}return tradeBox(kind,id)+planCard(kind,id,plans[k(kind,id,"swing")]?"swing":"day")}
function watchView(kind){const by=Object.fromEntries(picks[kind].map(x=>[x.id,x]));return S[kind+"s"].map(i=>{const w=S.watch[kind+"|"+i];return(by[i]?row(kind,by[i]):planCard(kind,i,"swing"))+(w&&by[i]?`<div class="mut">${w.fired?"Alert sent":"Waiting for "+money(w.entry)}</div>`:"")}).join("")||'<div class="card">This watchlist is empty. Open any item and add it.</div>'}
function listView(){const kind=tab==="Memes"?"coin":"stock";mine=false;return`<div id="list">${results()}</div>`}
function page(){
if(tab==="Home"){const errs=[problem.block,problem.coin&&"Meme coins: "+problem.coin,problem.fresh&&"New coins: "+problem.fresh,S.mkey?problem.stock&&"Stocks: "+problem.stock:"Stocks need your Massive key in Settings."].filter(Boolean);const top=(kd,l)=>l.slice(0,3).map(x=>row(kd,x)).join("")||'<div class="card mut">Nothing ready yet.</div>';
return hero()+errs.map(t=>`<div class="card bad">${esc(t)}</div>`).join("")+`<div class="grid">${Object.keys(BOTS).map(botTile).join("")}</div><div class="row">${btn("awake",awake?"Screen staying awake":"Keep screen awake","",awake?"sel":"")}${btn("scan","Scan now")}</div><h2>Top meme picks</h2>${top("coin",picks.coin.filter(ready))}<h2>Top stock picks</h2>${top("stock",longStocks())}<div class="row between"><h2>Alerts</h2>${btn("go","See all",'data-v="Alerts"')}</div>${alertList(3)}`}
if(tab==="Portfolio")return hero()+`<div class="card"><h2>Results by bot</h2>${Object.entries(BOTS).map(([k,n])=>`<div><b>${n}</b><div class="mut">${stats(B.done.filter(t=>t.bot===k))}</div></div>`).join("")}</div><h2>Holding (${B.open.length})</h2>${B.open.map(posCard).join("")||'<div class="card">Nothing held now.</div>'}<h2>Sold (${B.done.length})</h2>${B.done.slice(0,100).map(d=>`<div class="card"><div class="row between"><b>${esc(d.name)}</b>${signed(d.pl)}</div><div class="mut num">${BOTS[d.bot]||"Earlier trade"}${d.manual?" · your trade":""}${d.buy?` · $${d.size}<br>Bought ${money(d.buy)} ${new Date(d.bought).toLocaleString()}<br>Sold ${money(d.sell)} ${new Date(d.t).toLocaleString()}<br>Why: ${esc(d.why)}`:" · "+new Date(d.t).toLocaleString()}</div></div>`).join("")||'<div class="card">No sales yet.</div>'}`;
if(tab==="Memes"){const s=sub.Memes;return s==="Day bot"?botCard("memeDay")+newCoins():s==="Long bot"?botCard("memeLong")+'<h2>Coins that qualify now</h2>'+(picks.coin.filter(x=>x.long).slice(0,30).map(x=>row("coin",x)).join("")||'<div class="card">None qualify now. Waiting is fine.</div>'):s==="Watchlist"?watchView("coin"):listView()}
if(tab==="Stocks"){const s=sub.Stocks,n=stockNote?`<div class="card warn">${esc(stockNote)}</div>`:"";return n+(s==="Day bot"?botCard("stockDay")+`<div class="card mut">${esc(dayState)}</div>`:s==="Long bot"?botCard("stockLong")+'<h2>Stocks that qualify now</h2>'+(longStocks().slice(0,30).map(x=>row("stock",x)).join("")||'<div class="card">None yet. Wait for the scan.</div>'):s==="Watchlist"?watchView("stock"):listView())}
if(tab==="Item")return btn("go","Back",`data-v="${back}"`)+itemView();
if(tab==="Alerts")return btn("clear","Clear all")+alertList(50);
return`<div class="card"><h2>Settings</h2><label>Free Massive key, scans all stocks<input id="mkey" type="password" value="${esc(S.mkey)}" autocomplete="off"></label><div class="mut">Get one at <a href="https://massive.com/pricing" target="_blank" rel="noopener">massive.com</a>.</div><label>Free Twelve Data key, for stock day trading<input id="key" type="password" value="${esc(S.key)}" autocomplete="off"></label><div class="mut">Get one at <a href="https://twelvedata.com/pricing" target="_blank" rel="noopener">twelvedata.com</a>. Keys are saved in this browser.</div><label>Meme list minimum value $<input id="minCap" type="number" value="${S.minCap}"></label><label>Meme list maximum value $<input id="memeMax" type="number" value="${S.memeMax}"></label><label>Meme list minimum daily volume $<input id="minVol" type="number" value="${S.minVol}"></label></div><div class="card"><h2>Practice account</h2><label>Starting amount $<input id="start" type="number" min="100" value="${B.start}"></label>${btn("addcash","Add $1,000 practice cash")}<div class="mut">All four bots share this cash. Reset erases holdings, history and the chart. Keys, watchlists and bot settings stay.</div>${btn("reset","Reset practice account")}</div>`}
const subs={Memes:["Day bot","Long bot","All coins","Watchlist"],Stocks:["Day bot","Long bot","All stocks","Watchlist"]};
function render(){let h="";if(subs[tab]){h=`<div class="row">${subs[tab].map(s=>btn("sub",s,`data-v="${s}"`,sub[tab]===s?"sel":"")).join("")}</div>`;if(sub[tab].startsWith("All"))h+=`<input id="q" placeholder="Search" aria-label="Search" value="${esc(query)}">${filters()}`}
$("head").innerHTML=h;$("head").hidden=!h;$("body").innerHTML=page();$("alerts").innerHTML="";
$("nav").innerHTML=["Home","Portfolio","Memes","Stocks","Settings"].map(t=>`<button data-tab="${t}" class="${t===tab?"sel":""}">${t}</button>`).join("")}
let back="Home";
function show(kind,id){if(!id)return;if(tab!=="Item")back=tab;tradeMsg="";item=[kind,id];tab="Item";render();scrollTo(0,0)}
/* background updates never redraw over a field being typed in */
const refresh=()=>{if(!(document.activeElement?.tagName==="INPUT"||Date.now()-armed<5000))render()};
async function run(f){try{await f()}catch(e){say(e.message);if(f===scanCoins)problem.coin=e.message;if(f===scanStocks)problem.stock=e.message}refresh()}
document.addEventListener("securitypolicyviolation",e=>{if(e.violatedDirective.startsWith("connect")||e.violatedDirective.startsWith("default")){problem.block="This viewer is blocking live data. Download the file and open it in Chrome, Edge or Safari.";refresh()}});
async function wake(){try{awake=await navigator.wakeLock.request("screen");awake.addEventListener("release",()=>{awake=null;refresh()})}catch(e){say("This phone would not keep the screen awake. Change Auto-Lock in your phone settings instead.")}}
let wantAwake=false;
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(wantAwake)wake();run(fast);run(quick)}});
document.addEventListener("toggle",e=>{const d=e.target.dataset?.d;if(d)openD[d]=e.target.open},true);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const{act,kind,id,mode,v,uid}=b.dataset;if(b.dataset.tab){tab=b.dataset.tab;query="";limit=100;render();scrollTo(0,0);return}b.blur();
const confirmTap=text=>{if(b.textContent===text){armed=0;return true}b.textContent=text;armed=Date.now();return false};
if(act==="go"){tab=v;render();scrollTo(0,0)}else if(act==="sub"){sub[tab]=v;query="";limit=100;render()}else if(act==="range"){range=v;render()}
else if(act==="bot"){const c=B.bots[v];c.on=!c.on;if(c.on)c.since=Date.now();note(`${BOTS[v]} ${c.on?"started":"stopped"}.`);save();if(c.on){if(v==="stockLong")stockOrders();if(v==="memeDay")run(scanFresh);if(v==="memeLong")run(quick);if(v==="stockDay")run(stockDayStep)}render()}
else if(act==="sell"){const t=B.open.find(t=>t.uid===uid);if(t&&confirmTap(t.pending?"Tap again to cancel":"Tap again to sell")){sell(t,t.now,"you sold");render()}}
else if(act==="demo"){const size=+$("amt").value,bot=(kind==="stock"?"stock":"meme")+v;tradeMsg="";run(async()=>{try{let pl;if(kind==="stock"&&v==="Day"){pl=await check(kind,id,"day");if(pl.stale)throw Error("The market is closed, so a day trade cannot be opened now.")}else pl=plans[k(kind,id,"swing")]||(kind==="coin"?plans[k(kind,id,"day")]:null);if(!pl||pl.stale&&!(kind==="stock"&&v==="Long"))throw Error("No fresh price yet. Tap Get latest first.");if(buy(bot,kind,id,nameOf(kind,id),pl.last,"your trade",{manual:true,size,bar:pl.t})){tab="Portfolio";scrollTo(0,0)}else tradeMsg=lastWhy}catch(e){tradeMsg=e.message}})}
else if(act==="demonew"){const x=known(id);if(x&&confirmTap(x.rug?.ok?"Tap again to buy":"Not approved. Tap again anyway")){const ok=buy("memeDay","new",x.mint,x.name,x.price,"your trade",{manual:true,pool:x.pool});say(ok?"Bought. See Portfolio.":lastWhy);render()}}
else if(act==="awake"){wantAwake=!awake;if(awake){awake.release();awake=null;render()}else wake().then(refresh)}
else if(act==="reset"){const n=+$("start").value;if(n>=100&&confirmTap("Tap again to reset")){Object.assign(B,{start:n,cash:n,open:[],done:[],log:[],eq:[]});for(const c of Object.values(B.bots))c.on=false;snap(true);save();render()}}
else if(act==="addcash"){B.start+=1000;B.cash+=1000;B.eq=B.eq.map(x=>[x[0],x[1]+1000]);snap(true);save();say("Added $1,000 of practice cash.");render()}
else if(act==="scan"){run(scanFresh);run(scanCoins);run(scanStocks)}
else if(act==="col"){col=v;render()}else if(act==="info")run(()=>details(id));else if(act==="pin"){const i=B.pins.indexOf(id);if(i<0){B.pins.push(id);B.pins=B.pins.slice(-30);const x=every0.find(x=>x.pool===id)||fresh.find(x=>x.pool===id);if(x)tracked.push(x)}else{B.pins.splice(i,1);tracked=tracked.filter(x=>x.pool!==id)}save();render()}else if(act==="fresh")run(scanFresh);
else if(act==="show")show(kind,id);else if(act==="moreshow"){limit+=100;render()}else if(act==="chip"){chip=v;limit=100;render()}else if(act==="order"){smallest=v==="Smallest first";render()}
else if(act==="add"){const l=kind==="coin"?S.coins:S.stocks;if(!l.includes(id))l.push(id);const pl=plans[k(kind,id,"swing")];if(pl)S.watch[kind+"|"+id]=waitFor(pl);save();render()}
else if(act==="drop"){const f=kind==="coin"?"coins":"stocks";S[f]=S[f].filter(x=>x!==id);delete S.watch[kind+"|"+id];save();render()}
else if(act==="check"){say("Checking "+nameOf(kind,id)+"…");run(async()=>{await check(kind,id,mode);say("Updated.")})}
else if(act==="clear"){S.log=[];save();render()}});
document.addEventListener("input",e=>{const i=e.target.id,v=e.target.value,d=e.target.dataset;if(i==="amt"){amount=v;return}if(d.c){if(+v>0){B.bots[d.c][d.f]=+v;save()}return}if(d.bot){if(+v>0){B[d.bot]=+v;save()}return}if(i==="q"){query=v;const l=$("list");if(l)l.innerHTML=results()}else if(i==="key"||i==="mkey"){S[i]=v.trim();save()}else if(i==="minCap"||i==="minVol"||i==="memeMax"){S[i]=+v||0;save()}});
setInterval(()=>{if(B.open.some(t=>t.src==="new"))run(fast)},1e4);setInterval(()=>run(quick),3e4);setInterval(()=>run(scanFresh),6e4);setInterval(()=>run(scanCoins),6e5);setInterval(()=>run(stockDayStep),3e4);setInterval(()=>{if(S.mkey)run(scanStocks)},36e5);setInterval(()=>{snap();save()},12e4);
migrate();save();render();run(scanFresh);run(scanCoins);if(S.mkey)run(scanStocks);run(stockDayStep);
</script></body></html>
