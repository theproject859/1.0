<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout Scanner</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--fg:#14231f;--mut:#55685f;--line:#d5dfdb;--acc:#0b6e5a;--on:#fff;--good:#197a3e;--warn:#8a5a00;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1614;--card:#17221f;--fg:#e6efeb;--mut:#9bb0a8;--line:#2a3a35;--acc:#4fcfae;--on:#06201a;--good:#6bd18f;--warn:#e8b552;--bad:#ff8d83;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:12px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
h1{margin:0}h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.num{font-variant-numeric:tabular-nums}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}.sel{border-color:var(--acc);color:var(--acc);font-weight:700}
a{color:var(--acc)}svg{width:100%;height:100px}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:6px}nav button{flex:1 1 22%;padding:8px 2px;font-size:14px}
</style><body>
<nav id="nav"></nav><div class="wrap"><h1>Scout</h1><div id="status" class="mut" role="status"></div><div id="alerts"></div><div id="head" class="card"></div><div id="body" style="display:grid;grid-template-columns:minmax(0,1fr);gap:10px"></div></div>
<script>
const KEY="scoutlive-v1",CG="https://api.coingecko.com/api/v3",TD="https://api.twelvedata.com",MV="https://api.massive.com";
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const money=n=>n==null||!isFinite(n)?"?":"$"+(Math.abs(n)>=1?n.toLocaleString("en-US",{maximumFractionDigits:2}):Number(n.toPrecision(4)).toLocaleString("en-US",{maximumSignificantDigits:4}));
const big=n=>n>=1e9?"$"+(n/1e9).toFixed(1)+"B":"$"+(n/1e6).toFixed(1)+"M";
let S={key:"",mkey:"",seen:{},coins:[],stocks:[],pos:{},closed:[],log:[],minCap:1e5,minVol:1e4,memeMax:1e8,watch:{},risk:20};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){say("This browser could not save your changes.")}};
let tab="Best",open=null,item=null,mine=false,coinList=[],plans={},query="",picks={coin:[],stock:[]},scanned={coin:"",stock:""},busy={coin:false,stock:false},problem={coin:"",stock:"",block:""};
if(S.v!==3){S.v=3;S.minCap=1e5;S.minVol=1e4}
const coinMap=new Map(),coinRows=new Map();let limit=100,chip="All",smallest=false,stockNote="";
const SECTORS=Object.fromEntries(Object.entries({Technology:"AAPL MSFT NVDA AMD AVGO ORCL CRM ADBE INTC QCOM MU TXN IBM CSCO NOW PLTR SMCI ARM PANW CRWD SNOW DELL HPQ AMAT LRCX KLAC MRVL ANET FTNT DDOG NET MDB SHOP UBER APP IONQ RGTI SOUN BBAI",Communication:"GOOGL GOOG META NFLX DIS CMCSA T VZ TMUS WBD SNAP PINS RDDT SPOT ROKU EA TTWO RBLX",Health:"LLY UNH JNJ PFE MRK ABBV TMO ABT DHR BMY AMGN GILD CVS CI HUM ISRG MDT BSX SYK VRTX REGN MRNA BIIB HIMS",Finance:"JPM BAC WFC C GS MS SCHW BLK AXP V MA PYPL COF USB PNC TFC COIN HOOD SOFI UPST AFRM MSTR",Energy:"XOM CVX COP SLB EOG OXY MPC PSX VLO HAL DVN FANG KMI WMB APA RIG",Consumer:"AMZN WMT COST HD LOW TGT MCD SBUX NKE KO PEP PG CL MDLZ CMG BKNG ABNB DKNG CVNA GME CHWY ETSY DG DLTR KR MO PM",Industrials:"BA CAT DE GE HON LMT RTX NOC GD UPS FDX UNP CSX MMM ETN EMR RKLB ACHR JOBY",Autos_and_travel:"TSLA F GM RIVN LCID NIO XPEV LI UAL DAL AAL LUV CCL RCL NCLH",Materials:"LIN APD SHW FCX NEM NUE DOW DD ALB CLF AA MP",Utilities:"NEE DUK SO D AEP EXC SRE XEL VST CEG NRG OKLO SMR",Real_estate:"PLD AMT EQIX CCI PSA O SPG WELL DLR OPEN",Crypto_stocks:"MARA RIOT CLSK HUT BITF WULF CIFR IREN"}).flatMap(([n,l])=>l.split(" ").map(t=>[t,n.replace(/_/g," ")])));
const say=t=>$("status").textContent=t;
/* one request at a time per provider, spaced to stay inside free limits */
const lanes={cg:{gap:12000,t:0,q:Promise.resolve()},td:{gap:8000,t:0,q:Promise.resolve()},mv:{gap:12500,t:0,q:Promise.resolve()},gt:{gap:7000,t:0,q:Promise.resolve()},ds:{gap:1500,t:0,q:Promise.resolve()},rc:{gap:2500,t:0,q:Promise.resolve()}};
function get(lane,url){const L=lanes[lane];const run=async()=>{const w=L.t+L.gap-Date.now();if(w>0)await new Promise(r=>setTimeout(r,w));L.t=Date.now();let r;try{r=await fetch(url)}catch(e){throw Error("Could not reach the data service. Check your connection, and open this file in a web browser. A busy free service can also cause this.")}if(r.status===429){L.t=Date.now()+60000;throw Error("Free data limit reached. Wait a minute.")}const d=await r.json().catch(()=>null);if(!r.ok||!d||d.status==="error")throw Object.assign(Error(d&&(d.message||d.error)||"Data service error "+r.status),{status:r.status});return d};const p=L.q.then(run);L.q=p.catch(()=>{});return p}
/* small browser database for the stock history */
let dbp;const idb=()=>dbp||(dbp=new Promise(ok=>{try{const q=indexedDB.open("scoutscan",1);q.onupgradeneeded=()=>q.result.createObjectStore("c");q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)}catch(e){ok(null)}}));
const mem={};async function cache(key,val){const db=await idb();if(val!==undefined)mem[key]=val;if(!db)return mem[key];return new Promise(ok=>{try{const st=db.transaction("c",val===undefined?"readonly":"readwrite").objectStore("c"),q=val===undefined?st.get(key):st.put(val,key);q.onsuccess=()=>ok(val===undefined?q.result:val);q.onerror=()=>ok(mem[key])}catch(e){ok(mem[key])}})}
/* 0-100: how many "ready to run" conditions line up */
function score(pl,f){if(!pl||pl.stale)return 0;let n=0;if(pl.label==="BUY setup")n+=40;else if(pl.trend)n+=15;n+=Math.max(0,Math.min(20,f.week*100));n+=Math.max(0,Math.min(25,(f.surge-1)*25));if(f.day>0&&f.day<(f.coin?.25:.08))n+=15;return Math.round(n)}
const READY=70;
const ready=x=>x.pl.label==="BUY setup"&&x.score>=READY&&(!x.coin||Date.now()-x.pl.t<36e5);
function announce(kind,list){const now=new Set(list.filter(ready).map(x=>x.id)),old=new Set(S.seen[kind]||[]);list.filter(x=>now.has(x.id)&&!old.has(x.id)).slice(0,5).reverse().forEach(x=>alertUser(`Ready: ${x.sym} (score ${x.score}) buy near ${money(x.pl.entry)}`,kind,x.id));S.seen[kind]=[...now];save()}
function held(kind,id,pl){const key=kind+"|"+id,pos=S.pos[key];if(!pos||!pl||pl.stale)return;const call=exitCall(pos,pl)[0];if(call.startsWith("GET OUT")&&pos.told!==call){pos.told=call;alertUser(`${nameOf(kind,id)}: ${call} at ${money(pl.last)}`,kind,id)}}
const coinUrl=q=>`${CG}/coins/markets?vs_currency=usd&sparkline=true&price_change_percentage=24h,7d&${q}`;
function processCoins(d){const fire=[];for(const x of d){coinMap.set(x.id,x);const p=(x.sparkline_in_7d?.price||[]).filter(v=>v>0);if(p.length<30||!(x.current_price>0))continue;p.push(x.current_price);const t=Date.parse(x.last_updated)||Date.now(),pl=plan(p.map(c=>({t,c,h:c,l:c})),36e5,.02);plans[k("coin",x.id,"swing")]=pl;held("coin",x.id,pl);
const live=Date.now()-t<9e5;if(live){coinTrade(x.id,pl);watchCoin(x.id,pl)}
if(!(x.market_cap>=S.minCap&&x.market_cap<=S.memeMax&&x.total_volume>=S.minVol)){coinRows.delete(x.id);continue}const day=(x.price_change_percentage_24h_in_currency||0)/100,week=(x.price_change_percentage_7d_in_currency||0)/100;
const row={id:x.id,coin:true,sym:x.symbol.toUpperCase(),name:x.name,cap:x.market_cap,pl,day,score:score(pl,{coin:true,day,week,surge:1+(x.total_volume/x.market_cap)*5})};coinRows.set(x.id,row);if(live&&ready(row))fire.push(row)}
picks.coin=[...coinRows.values()].sort((a,b)=>b.score-a.score);announce("coin",picks.coin);fire.sort((a,b)=>b.score-a.score).forEach(x=>paperBuy("coin",x.id,x.pl.last,x.pl,"ready, score "+x.score));save()}
async function scanCoins(){if(busy.coin)return;busy.coin=true;try{let cut="",total=0;for(let page=1;page<=40;page++){let d,err;for(let n=0;n<3&&!d;n++){try{d=await get("cg",coinUrl(`category=meme-token&order=market_cap_desc&per_page=250&page=${page}`))}catch(e){err=e;lanes.cg.t=Date.now()+45000}}if(!d){if(!total)throw err;cut=err.message;break}total+=d.length;processCoins(d);scanned.coin=new Date().toLocaleTimeString();say(`Meme coins: ${total} checked, ${picks.coin.length} pass your filters. Still scanning…`);refresh();if(d.length<250||!(d[d.length-1].market_cap>=S.minCap))break}
problem.coin=cut?"Only part of the list loaded. "+cut:"";say(`Meme scan finished: ${total} checked, ${picks.coin.length} pass your filters.`)}finally{busy.coin=false}}
/* every minute: fresh prices for open trades, watchlist and ready coins */
let quickBusy=false;async function quick(){if(quickBusy)return;const ids=[...new Set([...B.open.filter(t=>t.kind==="coin").map(t=>t.id),...Object.keys(S.pos).filter(x=>x.startsWith("coin|")).map(x=>x.slice(5)),...S.coins,...picks.coin.filter(ready).slice(0,20).map(x=>x.id)])].slice(0,250);if(!ids.length)return;quickBusy=true;try{processCoins(await get("cg",coinUrl(`per_page=250&ids=${ids.map(encodeURIComponent)}`)))}finally{quickBusy=false}}
/* practice trades from the meme and stock lists */
function paperBuy(kind,id,price,pl,why,pending){if(!B.on||B.open.length>=B.max||B.cash<B.size||B.open.some(t=>t.id===id&&t.kind===kind)||B.done.some(t=>t.id===id&&Date.now()-t.t<216e5))return false;if(-todayPL()+B.open.reduce((a,t)=>a+t.size,0)+B.size>B.dayLoss)return false;const r=(pl.entry-pl.stop)/pl.entry,fee=kind==="coin"?FEE:.002,name=nameOf(kind,id);B.cash-=B.size;
const t={kind,id,name,size:B.size,fee,entry:price/(1-fee),now:price,stop:price*(1-r),target:price*(1+1.5*r),t:Date.now()};if(pending)Object.assign(t,{pending:true,limit:price,bar:pl.t,days:0});B.open.push(t);const text=pending?`Practice order: buy ${name} if it trades at ${money(price)} next session`:`Practice buy ${name} at ${money(price)} for $${B.size} (${why})`;note(text);alertUser(text,kind,id);return true}
function coinTrade(id,pl){const t=B.open.find(x=>x.kind==="coin"&&x.id===id);if(!t)return;t.now=pl.last;if(pl.last<=t.stop)closeTrade(t,pl.last,"stop hit");else if(pl.last>=t.target)closeTrade(t,pl.last,"target hit");else if(!pl.trend&&Date.now()-t.t>36e5)closeTrade(t,pl.last,"trend turned down")}
const waitFor=pl=>({entry:pl.entry,stop:pl.stop,target:pl.target,up:pl.entry>pl.last,t:Date.now(),bar:pl.t});
function watchCoin(id,pl){if(!S.coins.includes(id))return;const key="coin|"+id;let w=S.watch[key];if(!w||Date.now()-w.t>2592e5||w.fired&&Date.now()-w.fired>216e5){S.watch[key]=w=waitFor(pl);if(pl.label!=="BUY setup")return}if(w.fired)return;const hit=pl.label==="BUY setup"||(w.up?pl.last>=w.entry&&pl.last<=w.entry*1.1:pl.last<=w.entry&&pl.last>w.stop);if(!hit)return;w.fired=Date.now();alertUser(`Watchlist: time to look at buying ${nameOf("coin",id)} at ${money(pl.last)}`,"coin",id);paperBuy("coin",id,pl.last,pl.label==="BUY setup"?pl:w,"watchlist")}
/* stocks use daily bars: orders fill, stop or hit target on later days */
function stockTrade(id,pl){const t=B.open.find(x=>x.kind==="stock"&&x.id===id);if(t&&pl.t>t.bar){t.bar=pl.t;if(t.pending){if(pl.lo<=t.limit){const fill=Math.min(t.limit,pl.hi),r=fill/t.limit;Object.assign(t,{pending:false,entry:fill/(1-t.fee),stop:t.stop*r,target:t.target*r});note(`Practice buy filled: ${id} at ${money(fill)}`);alertUser(`Practice buy filled: ${id} at ${money(fill)}`,"stock",id);t.now=pl.last;if(pl.lo<=t.stop)closeTrade(t,t.stop,"stop hit")}else if(++t.days>=3){B.cash+=t.size;B.open=B.open.filter(x=>x!==t);note(`Practice order for ${id} expired without buying`)}}else{t.now=pl.last;if(pl.lo<=t.stop)closeTrade(t,Math.min(t.stop,pl.hi),"stop hit");else if(pl.hi>=t.target)closeTrade(t,Math.max(t.target,pl.lo),"target hit")}}
if(!S.stocks.includes(id))return;const key="stock|"+id,w=S.watch[key];if(!w){S.watch[key]=waitFor(pl);return}if(pl.t<=w.bar)return;if(w.up?pl.hi>=w.entry:pl.lo<=w.entry){alertUser(`Watchlist: ${id} reached your buy level ${money(w.entry)} on ${new Date(pl.t).toLocaleDateString()}`,"stock",id);paperBuy("stock",id,pl.last,pl.label==="BUY setup"?pl:w,"watchlist",true);S.watch[key]=waitFor(pl)}else if(Date.now()-w.t>6048e5)S.watch[key]=waitFor(pl)}
const stockOrders=()=>picks.stock.filter(ready).slice(0,3).forEach(x=>paperBuy("stock",x.id,x.pl.entry,x.pl,"ready",true));
const progress=t=>{stockNote=t;say(t);if(tab==="Stocks")refresh()};
async function stockNames(){let c=await cache("names");if(c&&Date.now()-c.t<7*864e5)return c.map;const map={};let url=`${MV}/v3/reference/tickers?type=CS&market=stocks&active=true&limit=1000`,n=0;while(url&&n<12){progress(`Step 1 of 2: getting the stock list, part ${++n}…`);const d=await get("mv",url+"&apiKey="+encodeURIComponent(S.mkey));for(const x of d.results||[])map[x.ticker]=x.name;url=d.next_url}await cache("names",{t:Date.now(),map});return map}
async function stockDays(want){const out=[],today=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date());for(let i=1;i<=80&&out.length<want;i++){const dt=new Date(Date.parse(today+"T12:00:00Z")-i*864e5),day=dt.toISOString().slice(0,10);if(dt.getUTCDay()%6===0)continue;let rows=await cache("d"+day);if(!rows){progress(`Step 2 of 2: reading day ${out.length+1} of ${want}. Results appear when all days are read, about 8 minutes the first time. Keep this page open.`);try{const d=await get("mv",`${MV}/v2/aggs/grouped/locale/us/market/stocks/${day}?adjusted=true&apiKey=${encodeURIComponent(S.mkey)}`);rows={};for(const x of d.results||[])rows[x.T]=[x.c,x.h,x.l,x.v]}catch(e){if(e.status===403&&i<=2)continue;throw e}if(i>2||Object.keys(rows).length)await cache("d"+day,rows)}if(Object.keys(rows).length)out.push({day,rows})}return out.reverse()}
async function scanStocks(){if(busy.stock)return;if(!S.mkey){say("Add your free Massive key in Settings to scan stocks.");return}busy.stock=true;try{const names=await stockNames(),days=await stockDays(32),out=[];if(!days.length)throw Error("No stock days came back.");for(const sym in names){const c=[];for(const d of days){const v=d.rows[sym];if(v)c.push({t:Date.parse(d.day+"T21:00:00Z"),c:v[0],h:v[1],l:v[2],v:v[3]})}if(c.length<30)continue;const pl=plan(c,5*864e5,.005);plans[k("stock",sym,"swing")]=pl;held("stock",sym,pl);if(c.at(-1).t===Date.parse(days.at(-1).day+"T21:00:00Z"))stockTrade(sym,pl);
const n=c.length,prior=c.slice(-21,-1),av=prior.reduce((a,x)=>a+x.v,0)/20,dollars=prior.reduce((a,x)=>a+x.v*x.c,0)/20;const px=c[n-1].c,penny=px<5;if(px<.3||dollars<(penny?2e6:2e7)||c[n-1].t!==Date.parse(days.at(-1).day+"T21:00:00Z"))continue;
const day=c[n-1].c/c[n-2].c-1,week=c[n-1].c/c[n-6].c-1;out.push({id:sym,sym,name:names[sym],penny,sector:SECTORS[sym]||"",pl,day,score:score(pl,{day,week,surge:c[n-1].v/av})})}
picks.stock=out.sort((a,b)=>b.score-a.score);scanned.stock=days.at(-1).day;announce("stock",picks.stock);stockOrders();save();problem.stock="";stockNote="";say(`Checked ${out.length} active stocks using closing prices from ${scanned.stock}.`)}catch(e){stockNote="Stock scan stopped: "+e.message;throw e}finally{busy.stock=false}}
async function candles(kind,id,mode){if(kind==="coin"){const d=await get("cg",`${CG}/coins/${encodeURIComponent(id)}/market_chart?vs_currency=usd&days=${mode==="day"?1:14}`);return d.prices.map(([t,c])=>({t,c,h:c,l:c}))}
if(!S.key)throw Error("Add your free Twelve Data key in Settings to see stock prices.");const d=await get("td",`${TD}/time_series?symbol=${encodeURIComponent(id)}&interval=${mode==="day"?"5min":"1day"}&outputsize=120&timezone=UTC&apikey=${encodeURIComponent(S.key)}`);return d.values.map(v=>({t:Date.parse(v.datetime.replace(" ","T")+(v.datetime.length>10?"Z":"T21:00:00Z")),c:+v.close,h:+v.high,l:+v.low})).reverse()}
const ema=(a,n)=>a.reduce((e,v)=>e+(v-e)*2/(n+1),a[0]);
function plan(c,maxAge,floor,now=Date.now()){if(c.length<30)return null;const p=c.map(x=>x.c),n=p.length,last=p[n-1],fast=ema(p,9),slow=ema(p,21);let up=0,dn=0,tr=0;for(let i=n-14;i<n;i++){const d=p[i]-p[i-1];d>0?up+=d:dn-=d;tr+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-p[i-1]),Math.abs(c[i].l-p[i-1]))}
const rsi=up+dn?100*up/(up+dn):50,atr=Math.max(tr/14,last*floor),trend=fast>slow&&last>slow;let label,cls,entry,why;
if(trend&&rsi>=45&&rsi<=70&&last<=fast+1.5*atr){label="BUY setup";cls="good";entry=last;why="Short average is above the long average and the move is not stretched."}
else if(trend){label="WAIT for a dip";cls="warn";entry=Math.min(fast,last-atr);why="Trend is up but the price is stretched or momentum is out of range. Consider buying only near the entry, if it holds."}
else{label="WAIT for a breakout";cls="warn";entry=Math.max(slow,...c.slice(-13,-1).map(x=>x.h),last+.5*atr);why="No uptrend now. Consider buying only if the price climbs to the entry."}
const stale=now-c[n-1].t>maxAge;if(stale){label="CLOSED or old data";cls="mut";why="The newest price is old. Check again when trading resumes."}
const stop=Math.max(entry-2*atr,entry*.5);return{label,cls,why,last,entry,stop,target:entry+1.5*(entry-stop),rsi,trend,stale,t:c[n-1].t,series:p,hi:c[n-1].h,lo:c[n-1].l}}
function exitCall(pos,pl){if(pl.last<=pos.stop)return["GET OUT: stop hit","bad"];if(pl.last>=pos.target)return["GET OUT: target reached, take profit","good"];if(!pl.trend)return["GET OUT: trend turned down","bad"];return["HOLD","warn"]}
const k=(kind,id,mode)=>kind+"|"+id+"|"+mode;
function show(kind,id){item=[kind,id];tab=kind==="new"?"New coins":"Item";render();scrollTo(0,0)}
function alertUser(text,kind,id){S.log.unshift({t:Date.now(),text,kind,id});S.log=S.log.slice(0,50);save();try{if(window.Notification&&Notification.permission==="granted"){const n=new Notification("Scout",{body:text});n.onclick=()=>{window.focus();show(kind,id)}}}catch(e){}}
async function check(kind,id,mode){const c=await candles(kind,id,mode),age=kind==="coin"?(mode==="day"?20*6e4:3*36e5):(mode==="day"?20*6e4:4*864e5);const pl=plan(c,age,kind==="coin"?.02:.002);if(!pl)throw Error("Not enough price history for "+id+" yet.");plans[k(kind,id,mode)]=pl;
held(kind,id,pl);return pl}
const nameOf=(kind,id)=>kind==="stock"?id:(coinMap.get(id)?.symbol.toUpperCase()||id);
const links=(kind,id)=>{const q=encodeURIComponent(nameOf(kind,id)+(kind==="coin"?" meme coin":" stock"));return`<div class="row"><a target="_blank" rel="noopener" href="https://news.google.com/search?q=${q}">News</a>${kind==="coin"?`<a target="_blank" rel="noopener" href="https://www.coingecko.com/en/coins/${encodeURIComponent(id)}">Coin page and contract</a>`:`<a target="_blank" rel="noopener" href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(id)}">Company filings</a>`}</div>`};
function spark(p){const lo=Math.min(...p),hi=Math.max(...p);return`<svg viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Price chart"><polyline fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke" points="${p.map((v,i)=>`${i/(p.length-1)*300},${95-(hi>lo?(v-lo)/(hi-lo):.5)*90}`).join(" ")}"/></svg>`}
function planCard(kind,id,mode){const pl=plans[k(kind,id,mode)],pos=S.pos[kind+"|"+id],d=`data-kind="${kind}" data-id="${esc(id)}" data-mode="${mode}"`;let h=`<div class="card"><div class="row between"><h2>${esc(nameOf(kind,id))}</h2><button ${d} data-act="check">Get latest</button></div>`;

async function rug(mint){const c=rugs[mint];if(c&&Date.now()-c.t<6e5)return c;let out;try{const d=await get("rc",`${RC}/${encodeURIComponent(mint)}/report/summary`);if(d.error||!Array.isArray(d.risks)||d.score_normalised==null)throw Error("incomplete");const bad=d.risks.filter(x=>x.level==="danger");out={ok:!bad.length&&d.score_normalised<=30,risk:+d.score_normalised,lp:+d.lpLockedPct||0,why:`Risk ${d.score_normalised} of 100 (lower is better). ${d.risks.map(x=>x.name).join(", ")||"No risks listed"}.`}}catch(e){out={ok:false,why:"Rug check could not be completed, so this coin is not approved."}}return rugs[mint]={...out,t:Date.now()}}

async function scanFresh(){if(freshBusy)return;freshBusy=true;try{await manage();const seen=new Map();const add=d=>{for(const x of d.data||[]){const q=pool(x);if(q.mint&&!seen.has(q.mint))seen.set(q.mint,q)}};for(const page of [1,2])add(await get("gt",`${GT}/new_pools?page=${page}`));for(const q of seen.values())if(q.age<60&&q.liq>=B.minLiq/2)B.wait[q.pool]??={born:Date.now()-q.age*6e4,seen:0};for(const key in B.wait)if(!(Date.now()-B.wait[key].born<36e5*6))delete B.wait[key];const due=Object.keys(B.wait).filter(key=>Date.now()-B.wait[key].born>=3e5).sort((a,b)=>B.wait[a].seen-B.wait[b].seen).slice(0,30);if(due.length){const d=await get("gt",`${GT}/pools/multi/${due.map(encodeURIComponent)}`);due.forEach(key=>B.wait[key].seen=Date.now());for(const x of d.data||[]){const q=pool(x);seen.set(q.mint,q)}}add(await get("gt",`${GT}/trending_pools?page=1`));const every=[...seen.values()],why={};every0=every;if(B.pins.length){const d=await get("gt",`${GT}/pools/multi/${B.pins.slice(-30).map(encodeURIComponent)}`);tracked=(d.data||[]).map(pool)}for(const q of every){const w=reason(q);if(w)why[w]=(why[w]||0)+1}const list=every.filter(passes).map(x=>({...x,heat:heat(x)})).sort((a,b)=>b.heat-a.heat);for(const x of list.slice(0,25))x.rug=await rug(x.mint);for(const x of list){x.rug??={ok:false,why:"Not rug checked yet, so not approved."};x.safe=safeScore(x)}list.sort((a,b)=>b.safe-a.safe||b.heat-a.heat);for(const x of list){if(x.rug.ok&&x.heat>=70){if(!B.told.includes(x.mint)){B.told=[x.mint,...B.told].slice(0,100);alertUser(`New coin ${x.name}: squeeze ${x.heat}, safety ${x.safe}`,"new",x.mint)}botBuy(x)}}fresh=list;stats={seen:every.length,why,passed:list.length,rug:list.filter(x=>!x.rug.ok).length,low:list.filter(x=>x.rug.ok&&x.heat<70).length};freshAt=new Date().toLocaleTimeString();problem.fresh="";save();say(`New coins checked: ${seen.size}. Passed the first filters: ${list.length}.`)}catch(e){problem.fresh=e.message;throw e}finally{freshBusy=false}}

else if(tab==="Alerts"){h=`<h2>Alerts</h2><div class="mut">Tap an alert to open it.</div><button data-act="clear">Clear all</button>`;b=S.log.map(a=>`<button class="card" style="text-align:left" data-act="show" data-kind="${esc(a.kind)}" data-id="${esc(a.id)}"><span>${esc(a.text)}</span><span class="mut">${new Date(a.t).toLocaleString()}</span></button>`).join("")||'<div class="card">No alerts yet.</div>'}
else if(tab==="Day trade"){if(!all().some(([t,i])=>t+"|"+i===open))open=all()[0]?.join("|")||null;h=`<h2>Day trade</h2><div class="mut">Uses 5-minute prices. The chosen item refreshes every minute. These are rule-based suggestions that have not been tested for profit. Most day traders lose money.</div><label>Max loss per trade $<input id="risk" type="number" min="1" value="${S.risk}"></label><div class="row">${all().map(([t,i])=>`<button data-act="pick" data-v="${esc(t+"|"+i)}" class="${open===t+"|"+i?"sel":""}">${esc(nameOf(t,i))}</button>`).join("")}</div>`;
if(open){const[t,i]=open.split("|");b=planCard(t,i,"day")}else b='<div class="card">Add coins or stocks to a watchlist first.</div>';
const done=S.closed;if(done.length)b+=`<div class="card"><h2>Your results</h2><div>Winning trades: ${done.filter(x=>x.g>0).length}. Closed trades: ${done.length}.</div>${done.slice(0,15).map(x=>`<div class="row between"><span>${esc(x.name)}</span><span class="${x.g>0?"good":"bad"}">${(x.g*100).toFixed(1)}%</span></div>`).join("")}</div>`}
else{h=`<h2>Settings</h2><label>Free Massive key, scans all stocks<input id="mkey" type="password" value="${esc(S.mkey)}" autocomplete="off"></label><div class="mut">Get one at <a href="https://massive.com/pricing" target="_blank" rel="noopener">massive.com</a>.</div><label>Free Twelve Data key, only for stock day trading<input id="key" type="password" value="${esc(S.key)}" autocomplete="off"></label><div class="mut">Get one at <a href="https://twelvedata.com/pricing" target="_blank" rel="noopener">twelvedata.com</a>. Keys are saved in this browser.</div><label>Meme coin minimum size $<input id="minCap" type="number" value="${S.minCap}"></label><label>Meme coin maximum size $<input id="memeMax" type="number" value="${S.memeMax}"></label><label>Meme coin minimum daily volume $<input id="minVol" type="number" value="${S.minVol}"></label>`}
$("head").innerHTML=h;$("body").innerHTML=b;banner();
$("nav").innerHTML=["Best","New coins","Memes","Stocks","Day trade","Alerts","Settings"].map(t=>`<button data-tab="${t}" class="${t===tab?"sel":""}">${t}</button>`).join("")}
function banner(){const a=S.log[0];$("alerts").innerHTML=a&&tab!=="Alerts"?`<button class="card" style="text-align:left;width:100%;border-color:var(--acc)" data-act="show" data-kind="${esc(a.kind)}" data-id="${esc(a.id)}"><b>Latest alert</b><span>${esc(a.text)}</span></button>`:""}
/* background updates never redraw over a field being typed in */
const refresh=()=>{if(document.activeElement?.tagName==="INPUT")banner();else render()};
async function run(f){try{await f()}catch(e){say(e.message);if(f===scanCoins)problem.coin=e.message;if(f===scanStocks)problem.stock=e.message}refresh()}
document.addEventListener("securitypolicyviolation",e=>{if(e.violatedDirective.startsWith("connect")||e.violatedDirective.startsWith("default")){problem.block="This viewer is blocking live data. Download the file and open it in Chrome, Edge or Safari.";refresh()}});
function health(){const m=[problem.block,problem.coin&&"Meme coins: "+problem.coin,S.mkey?problem.stock&&"Stocks: "+problem.stock:"Stocks: no Massive key yet. Add it in Settings, then scan."].filter(Boolean);return m.map(t=>`<div class="card bad">${esc(t)}</div>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const{act,kind,id,mode}=b.dataset;if(b.dataset.tab){tab=b.dataset.tab;query="";limit=100;render();scrollTo(0,0);return}b.blur();
if(act==="col"){col=b.dataset.v;render()}else if(act==="info")run(()=>details(id));else if(act==="pin"){const i=B.pins.indexOf(id);if(i<0){B.pins.push(id);B.pins=B.pins.slice(-30);const x=every0.find(x=>x.pool===id)||fresh.find(x=>x.pool===id);if(x)tracked.push(x)}else{B.pins.splice(i,1);tracked=tracked.filter(x=>x.pool!==id)}save();render()}else if(act==="fresh")run(scanFresh);else if(act==="bot"){B.on=!B.on;if(B.on){B.streakFrom=Date.now();note("Bot started in practice mode.")}else note("Bot stopped. Open practice trades are still watched.");save();if(B.on){stockOrders();run(quick);run(scanFresh)}render()}else if(act==="botreset"){if(b.textContent!=="Tap again to reset"){b.textContent="Tap again to reset";return}Object.assign(B,{on:false,cash:1000,open:[],done:[],log:[]});save();render()}else if(act==="scan"){run(scanFresh);run(scanCoins);run(scanStocks)}else if(act==="show")show(kind,id);else if(act==="home"){tab="Best";render()}else if(act==="all"||act==="mine"){mine=act==="mine";render()}
else if(act==="moreshow"){limit+=100;render()}else if(act==="chip"){chip=b.dataset.v;limit=100;render()}else if(act==="order"){smallest=b.dataset.v==="Smallest first";render()}else if(act==="paper"){const pl=plans[k(kind,id,mode)],was=B.on;B.on=true;const ok=paperBuy(kind,id,kind==="stock"?pl.entry:pl.last,pl,"you tapped",kind==="stock");B.on=was;say(ok?"Practice trade added. See New coins.":"Not added. You may already hold it, or a bot limit is reached.");if(ok&&!was)say("Practice trade added. Start the bot so it keeps being managed.");save();render()}
else if(act==="add"){const l=kind==="coin"?S.coins:S.stocks;if(!l.includes(id))l.push(id);const pl=plans[k(kind,id,"swing")];if(pl)S.watch[kind+"|"+id]=waitFor(pl);save();render()}
else if(act==="drop"){if(S.pos[kind+"|"+id]){say("Record the sale before removing this one.");return}const f=kind==="coin"?"coins":"stocks";S[f]=S[f].filter(x=>x!==id);delete S.watch[kind+"|"+id];save();render()}
else if(act==="check"){say("Checking "+nameOf(kind,id)+"…");run(async()=>{await check(kind,id,mode);say("Updated.")})}
else if(act==="bought"||act==="sold"){const v=+$("px-"+id).value,key=kind+"|"+id;if(!(v>0)){say("Enter the price first.");return}if(act==="bought"){const pl=plans[k(kind,id,mode)],r=(pl.entry-pl.stop)/pl.entry;S.pos[key]={buy:v,stop:v*(1-r),target:v*(1+1.5*r)}}else{S.closed.unshift({name:nameOf(kind,id),g:v/S.pos[key].buy-1});delete S.pos[key]}save();render()}
else if(act==="pick"){open=b.dataset.v;render();const[t,i]=open.split("|");run(()=>check(t,i,"day"))}
else if(act==="clear"){S.log=[];save();render()}
else if(act==="notify"){if(window.Notification)Notification.requestPermission().then(r=>say(r==="granted"?"Notifications on while this page stays open.":"Notifications are not allowed here. Alerts still show on the page."));else say("This browser has no notifications. Alerts still show on the page.")}});
document.addEventListener("input",e=>{const i=e.target.id,v=e.target.value;if(e.target.dataset.bot){if(+v>0){B[e.target.dataset.bot]=+v;save()}return}if(i==="q"){query=v;$("body").innerHTML=results()}else if(i==="key"||i==="mkey"){S[i]=v.trim();save()}else if(i==="minCap"||i==="minVol"||i==="memeMax"){S[i]=+v||0;save()}else if(i==="risk"&&+v>0){S.risk=+v;save()}});
setInterval(()=>run(scanCoins),6e5);setInterval(()=>run(quick),6e4);setInterval(()=>run(scanFresh),6e4);setInterval(()=>{if(S.mkey)run(scanStocks)},36e5);
setInterval(()=>{if(tab==="Day trade"&&open&&!document.hidden){const[t,i]=open.split("|");if(t==="coin"||S.key)run(()=>check(t,i,"day"))}},60000);
render();run(scanFresh);run(scanCoins);if(S.mkey)run(scanStocks);
</script></body></html>
